name: Build and publish Docker image

on:
  push:
    branches: [main]
    # Skip doc-only / config-only pushes — image content doesn't change so
    # there's no point burning 20+ min of multi-arch Docker build time.
    # Tag pushes ALWAYS trigger regardless of paths (cuts a real release).
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "LICENSE"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/PULL_REQUEST_TEMPLATE.md"
      - ".gitignore"
      # The runner stage of the Dockerfile doesn't COPY scripts/, so
      # changes to operator/dev-only scripts produce an identical
      # runtime image. EXCLUDED from this list: scripts/build-version.mjs,
      # which IS invoked via the prebuild hook and affects the bundle.
      - "scripts/admin/**"
      - "scripts/screenshots/**"
      - "scripts/probe-photos.mjs"
      - "scripts/refresh-demo-dates.mjs"
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          # Publish BOTH "0.4.0" and "v0.4.0" so the form documented in
          # install.sh (STAYBATTLE_TAG=v0.4.0) works alongside the bare
          # semver form. Without this, the v-prefixed tag would 404.
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern=v{{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64
